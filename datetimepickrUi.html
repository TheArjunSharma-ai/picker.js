<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Schedule Appointment - Indigo Precision</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "error-container": "#ffdad6",
                        "surface-container": "#e6eeff",
                        "surface-variant": "#d5e3fc",
                        "surface-container-highest": "#d5e3fc",
                        "inverse-primary": "#c3c0ff",
                        "secondary": "#4648d4",
                        "outline": "#777584",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#07006c",
                        "on-tertiary-fixed": "#171c25",
                        "on-primary-fixed-variant": "#3b35a7",
                        "surface-bright": "#f8f9ff",
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-tertiary-container": "#abb0bc",
                        "on-surface-variant": "#464553",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#c3c0ff",
                        "primary": "#1f108e",
                        "surface-container-high": "#dce9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-dim": "#ccdbf3",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface": "#f8f9ff",
                        "secondary-container": "#6063ee",
                        "secondary-fixed": "#e1e0ff",
                        "tertiary-container": "#3e434d",
                        "on-tertiary-fixed-variant": "#424751",
                        "on-secondary-container": "#fffbff",
                        "primary-container": "#3730a3",
                        "surface-tint": "#544fc0",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#a9a7ff",
                        "tertiary-fixed-dim": "#c2c6d3",
                        "on-surface": "#0d1c2e",
                        "inverse-surface": "#233144",
                        "tertiary-fixed": "#dee2ef",
                        "tertiary": "#282d36",
                        "on-background": "#0d1c2e",
                        "outline-variant": "#c8c4d5",
                        "surface-container-low": "#eff4ff",
                        "on-primary-fixed": "#0f0069",
                        "background": "#f8f9ff",
                        "primary-fixed": "#e2dfff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "sm": "8px",
                        "md": "16px",
                        "container-padding": "20px",
                        "unit": "4px",
                        "xl": "32px",
                        "grid-gutter": "8px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "label-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "display-time": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "num-picker": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "display-time": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "num-picker": ["24px", {"lineHeight": "32px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
        }
        .day-cell {
            aspect-ratio: 1/1;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-shadow {
            box-shadow: 0px 10px 25px -5px rgba(55, 48, 163, 0.08);
        }
        .active-selection {
            background-color: #1f108e;
            color: #ffffff;
        }
        .today-dot::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #1f108e;
        }
        .active-selection.today-dot::after {
            background-color: #ffffff;
        }
        .clock-face {
            aspect-ratio: 1/1;
            position: relative;
            background: #ffffff;
            box-shadow: inset 2px 2px 5px rgba(55, 48, 163, 0.05), inset -2px -2px 5px rgba(255, 255, 255, 0.8), 0px 4px 12px rgba(55, 48, 163, 0.06);
        }
        .clock-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 2px;
            background: #1f108e;
            transform-origin: bottom center;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }
        .clock-hand::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            background: #1f108e;
            border-radius: 50%;
        }
        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #1f108e;
            border-radius: 50%;
            z-index: 20;
        }
        .number-node {
            position: absolute;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            font-weight: 500;
            color: #464553;
            transition: color 0.2s;
            cursor: pointer;
        }
        .number-node.active {
            color: #ffffff;
            z-index: 15;
        }
        .am-pm-toggle .active {
            background-color: #3730a3;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Sticky Header: Selection Area -->
<header class="sticky top-0 w-full z-40 bg-primary shadow-lg p-lg text-on-primary">
<div class="max-w-2xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-md">
<div class="flex flex-col">
<span class="font-label-md text-label-md uppercase tracking-widest opacity-70 mb-xs">Selection</span>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary-fixed-dim">calendar_month</span>
<span class="font-headline-sm text-headline-sm" id="summary-date">Oct 24, 2023</span>
<span class="text-on-primary/40 mx-xs">|</span>
<span class="font-headline-sm text-headline-sm" id="summary-time">10:30 AM</span>
</div>
</div>
<div class="flex gap-md sm:hidden border-t border-on-primary/20 pt-md">
<button class="flex-1 py-2 font-label-lg border border-on-primary/30 rounded-lg">Cancel</button>
<button class="flex-1 py-2 font-label-lg bg-surface-container-lowest text-primary rounded-lg font-bold">Confirm</button>
</div>
</div>
</header>
<main class="w-full max-w-2xl px-container-padding py-lg flex flex-col space-y-lg pb-32">
<!-- Date Selection Card -->
<section class="bg-surface-container-lowest rounded-xl card-shadow overflow-hidden border border-outline-variant/30">
<div class="p-md bg-surface-container-low flex items-center justify-between">
<h2 class="font-label-lg text-label-lg text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">event</span> Select Date
                </h2>
<div class="flex items-center gap-sm">
<span class="font-body-sm font-semibold text-on-surface" id="current-month-label">October 2023</span>
<div class="flex gap-xs ml-md">
<button class="material-symbols-outlined w-8 h-8 flex items-center justify-center text-outline hover:bg-surface-container rounded-full" onclick="changeMonth(-1)">chevron_left</button>
<button class="material-symbols-outlined w-8 h-8 flex items-center justify-center text-outline hover:bg-surface-container rounded-full" onclick="changeMonth(1)">chevron_right</button>
</div>
</div>
</div>
<div class="p-md">
<div class="grid grid-cols-7 mb-sm">
<div class="text-center font-label-md text-outline py-2">S</div>
<div class="text-center font-label-md text-outline py-2">M</div>
<div class="text-center font-label-md text-outline py-2">T</div>
<div class="text-center font-label-md text-outline py-2">W</div>
<div class="text-center font-label-md text-outline py-2">T</div>
<div class="text-center font-label-md text-outline py-2">F</div>
<div class="text-center font-label-md text-outline py-2">S</div>
</div>
<div class="grid grid-cols-7 gap-sm" id="days-grid">
<!-- JS Injected -->
</div>
</div>
</section>
<!-- Time Selection Card -->
<section class="bg-surface-container-lowest rounded-xl card-shadow overflow-hidden border border-outline-variant/30">
<div class="p-md bg-surface-container-low">
<h2 class="font-label-lg text-label-lg text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">schedule</span> Select Time
                </h2>
</div>
<div class="flex flex-col items-center p-md">
<!-- Digital Display -->
<div class="flex items-center gap-4 py-6">
<div class="flex items-baseline gap-1">
<span class="font-display-time text-display-time text-primary" id="display-hour">10</span>
<span class="font-display-time text-display-time text-on-surface-variant">:</span>
<span class="font-display-time text-display-time text-on-surface-variant" id="display-minute">30</span>
</div>
<div class="am-pm-toggle flex flex-col bg-surface-container-low rounded-xl p-1 shadow-sm border border-outline-variant">
<button class="px-3 py-1.5 rounded-lg font-label-lg active transition-all" id="toggle-am">AM</button>
<button class="px-3 py-1.5 rounded-lg font-label-lg text-on-surface-variant transition-all" id="toggle-pm">PM</button>
</div>
</div>
<div class="flex gap-2 mb-8">
<button class="px-6 py-2 rounded-full font-label-lg bg-primary-container text-on-primary-container shadow-md" id="mode-hour">Hour</button>
<button class="px-6 py-2 rounded-full font-label-lg bg-surface-container-high text-on-surface-variant" id="mode-minute">Minute</button>
</div>
<!-- Analog Clock -->
<div class="clock-face w-full max-w-[280px] rounded-full flex items-center justify-center touch-none mb-4" id="clock-container">
<div class="clock-center"></div>
<div class="clock-hand" id="clock-hand" style="height: 40%; transform: rotate(300deg);"></div>
<div class="absolute inset-0 w-full h-full" id="clock-numbers">
<!-- Numbers will be injected by JS -->
</div>
</div>
</div>
</section>
</main>
<!-- Fixed Footer -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-lowest border-t border-outline-variant/30 py-md px-container-padding flex justify-center shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
<div class="max-w-2xl w-full flex gap-md">
<button class="flex-1 py-3 font-label-lg text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-xl">Cancel</button>
<button class="flex-1 py-3 font-label-lg bg-primary text-on-primary rounded-xl shadow-lg active:scale-95 transition-all">Confirm Appointment</button>
</div>
</footer>
<script>
        // --- CALENDAR LOGIC ---
        let currentDate = new Date();
        let selectedDate = new Date();
        let viewDate = new Date(selectedDate);
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const shortMonths = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        function renderCalendar() {
            const grid = document.getElementById('days-grid');
            const monthLabel = document.getElementById('current-month-label');
            const summaryDate = document.getElementById('summary-date');

            grid.innerHTML = '';
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            monthLabel.innerText = `${monthNames[month]} ${year}`;

            summaryDate.innerText = `${shortMonths[selectedDate.getMonth()]} ${selectedDate.getDate()}, ${selectedDate.getFullYear()}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();

            for (let i = firstDay; i > 0; i--) {
                const cell = createDayCell(prevMonthDays - i + 1, 'text-outline opacity-30 pointer-events-none');
                grid.appendChild(cell);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const isToday = i === currentDate.getDate() && month === currentDate.getMonth() && year === currentDate.getFullYear();
                const isSelected = i === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear();
                
                let classes = 'text-on-surface hover:bg-surface-container-high cursor-pointer rounded-full';
                if (isSelected) classes = 'active-selection rounded-full';
                if (isToday) classes += ' today-dot relative';

                const cell = createDayCell(i, classes);
                cell.addEventListener('click', () => {
                    selectedDate = new Date(year, month, i);
                    renderCalendar();
                });
                grid.appendChild(cell);
            }
        }

        function createDayCell(content, classes) {
            const div = document.createElement('div');
            div.className = `day-cell flex items-center justify-center font-label-md ${classes}`;
            div.innerText = content;
            return div;
        }

        window.changeMonth = function(dir) {
            viewDate.setMonth(viewDate.getMonth() + dir);
            renderCalendar();
        };

        // --- CLOCK LOGIC ---
        const clockHand = document.getElementById('clock-hand');
        const clockNumbers = document.getElementById('clock-numbers');
        const clockContainer = document.getElementById('clock-container');
        const displayHour = document.getElementById('display-hour');
        const displayMinute = document.getElementById('display-minute');
        const modeHourBtn = document.getElementById('mode-hour');
        const modeMinuteBtn = document.getElementById('mode-minute');
        const amBtn = document.getElementById('toggle-am');
        const pmBtn = document.getElementById('toggle-pm');
        const summaryTime = document.getElementById('summary-time');

        let currentMode = 'hour';
        let selectedHour = 10;
        let selectedMinute = 30;
        let isAM = true;

        function updateClockDisplay() {
            displayHour.innerText = selectedHour.toString().padStart(2, '0');
            displayMinute.innerText = selectedMinute.toString().padStart(2, '0');
            
            const period = isAM ? 'AM' : 'PM';
            summaryTime.innerText = `${selectedHour.toString().padStart(2, '0')}:${selectedMinute.toString().padStart(2, '0')} ${period}`;
            
            if (currentMode === 'hour') {
                const angle = selectedHour * 30;
                clockHand.style.transform = `rotate(${angle}deg)`;
                displayHour.classList.add('text-primary');
                displayHour.classList.remove('text-on-surface-variant');
                displayMinute.classList.add('text-on-surface-variant');
                displayMinute.classList.remove('text-primary');
            } else {
                const angle = selectedMinute * 6;
                clockHand.style.transform = `rotate(${angle}deg)`;
                displayMinute.classList.add('text-primary');
                displayMinute.classList.remove('text-on-surface-variant');
                displayHour.classList.add('text-on-surface-variant');
                displayHour.classList.remove('text-primary');
            }
            renderClockNumbers();
        }

        function renderClockNumbers() {
            clockNumbers.innerHTML = '';
            const radius = 110; 
            const center = 140; // max-w-280 / 2
            
            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30) * (Math.PI / 180);
                const x = center + radius * Math.sin(angle);
                const y = center - radius * Math.cos(angle);
                
                const node = document.createElement('div');
                node.className = 'number-node font-label-md';
                node.style.left = `${x}px`;
                node.style.top = `${y}px`;
                
                if (currentMode === 'hour') {
                    node.innerText = i;
                    if (i === selectedHour) node.classList.add('active');
                } else {
                    const min = (i * 5) % 60;
                    node.innerText = min === 0 ? '00' : min;
                    if (min === selectedMinute) node.classList.add('active');
                }
                clockNumbers.appendChild(node);
            }
        }

        function handlePointer(e) {
            const rect = clockContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = clientX - centerX;
            const dy = clientY - centerY;
            
            let angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
            if (angle < 0) angle += 360;

            if (currentMode === 'hour') {
                let hour = Math.round(angle / 30);
                if (hour === 0) hour = 12;
                selectedHour = hour;
            } else {
                selectedMinute = Math.round(angle / 6) % 60;
            }
            updateClockDisplay();
        }

        function setupClockInteractions() {
            const onMove = (e) => { e.preventDefault(); handlePointer(e); };
            const onUp = () => {
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
                window.removeEventListener('touchmove', onMove);
                window.removeEventListener('touchend', onUp);
                if (currentMode === 'hour') setTimeout(() => switchMode('minute'), 300);
            };

            clockContainer.addEventListener('mousedown', (e) => {
                handlePointer(e);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            });
            clockContainer.addEventListener('touchstart', (e) => {
                handlePointer(e);
                window.addEventListener('touchmove', onMove, { passive: false });
                window.addEventListener('touchend', onUp);
            }, { passive: false });
        }

        function switchMode(mode) {
            currentMode = mode;
            if (mode === 'hour') {
                modeHourBtn.className = 'px-6 py-2 rounded-full font-label-lg bg-primary-container text-on-primary-container shadow-md';
                modeMinuteBtn.className = 'px-6 py-2 rounded-full font-label-lg bg-surface-container-high text-on-surface-variant';
                clockHand.style.height = '40%';
            } else {
                modeMinuteBtn.className = 'px-6 py-2 rounded-full font-label-lg bg-primary-container text-on-primary-container shadow-md';
                modeHourBtn.className = 'px-6 py-2 rounded-full font-label-lg bg-surface-container-high text-on-surface-variant';
                clockHand.style.height = '45%';
            }
            updateClockDisplay();
        }

        modeHourBtn.onclick = () => switchMode('hour');
        modeMinuteBtn.onclick = () => switchMode('minute');
        amBtn.onclick = () => { isAM = true; amBtn.classList.add('active'); amBtn.classList.remove('text-on-surface-variant'); pmBtn.classList.remove('active'); pmBtn.classList.add('text-on-surface-variant'); updateClockDisplay(); };
        pmBtn.onclick = () => { isAM = false; pmBtn.classList.add('active'); pmBtn.classList.remove('text-on-surface-variant'); amBtn.classList.remove('active'); amBtn.classList.add('text-on-surface-variant'); updateClockDisplay(); };

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            updateClockDisplay();
            setupClockInteractions();
        });
    </script>
</body></html>
